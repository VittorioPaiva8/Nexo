# Backend do Nexo no Fly.io, região GRU (São Paulo) — padrão ITAX.
# O nome do app vem da variável FLY_APP no workflow de publicação.
app = "nexo-itax"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "sh scripts/release.sh"

[env]
  PORT = "3000"
  JWT_EXPIRES_IN = "8h"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/docs"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
