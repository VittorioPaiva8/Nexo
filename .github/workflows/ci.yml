name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexo_test?schema=public
      DATABASE_URL_TESTE: postgresql://postgres:postgres@localhost:5432/nexo_test?schema=public
      JWT_SECRET: segredo-de-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Tipos do Worker
        run: npx tsc -p cloudflare/tsconfig.json
      # A mesma bateria e2e contra a API do Cloudflare Worker (cloudflare/api.ts), rodando localmente.
      - name: Testes e2e no Worker
        run: |
          printf 'DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/nexo_test"\nJWT_SECRET="segredo-de-ci"\n' > .dev.vars
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 2; done
          E2E_URL=http://127.0.0.1:8787/api npm run test:e2e || { cat wrangler-dev.log; exit 1; }
        env:
          WRANGLER_SEND_METRICS: 'false'
