name: Publicar

# Ambiente de teste no Cloudflare Workers (plano gratuito): frontend (arquivos estáticos) + API
# (cloudflare/api.ts), com PostgreSQL no Neon. Exceção ao guia ITAX aprovada para o teste (o guia prevê Fly.io).
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL (Neon, conexão direta)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: publicar

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Conferir segredos
        run: |
          for s in DATABASE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!s}" ]; then echo "::error::Falta o segredo $s no repositório"; exit 1; fi
          done

      - run: npm ci
      - run: npm ci
        working-directory: web

      - name: Migrações do banco
        run: npx prisma migrate deploy

      - name: Dados iniciais (setores, tipos e usuários de teste)
        if: ${{ vars.SEED_AO_PUBLICAR != 'false' }}
        run: npx tsx prisma/seed.ts
        env:
          SEED_DEMO: ${{ vars.SEED_DEMO || 'true' }}

      - name: Build do frontend
        run: npm run build
        working-directory: web
        env:
          VITE_API_URL: /api

      - name: Publicar no Cloudflare
        run: npx wrangler deploy

      - name: Segredos da API
        run: |
          if ! npx wrangler secret list | grep -q '"JWT_SECRET"'; then
            printf '%s' "$(openssl rand -hex 32)" | npx wrangler secret put JWT_SECRET
          fi
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
