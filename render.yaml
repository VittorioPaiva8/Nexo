# Blueprint do Render (plano gratuito) do Nexo, só para o ambiente de teste.
# No Render: New → Blueprint → escolha este repositório e preencha o DATABASE_URL (Neon).
services:
  - type: web
    name: nexo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /docs
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: SEED_DEMO
        value: 'true'
